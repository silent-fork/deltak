# Local full-stack run: engine + HUD.
#
#   cp .env.example backend/.env   # fill in Supabase + Angel One settings
#   docker compose up --build
#
# HUD  → http://localhost:3000
# API  → http://localhost:8000/docs
services:
  engine:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DK_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - scrip-cache:/app/.cache
    restart: unless-stopped

  hud:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://engine:8000
    environment:
      NEXT_PUBLIC_API_URL: http://engine:8000
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  scrip-cache:
